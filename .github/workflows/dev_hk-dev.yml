name: Deploy CMS to VPS

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: { }

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}            # owner/repo
      APP_DIR: ${{ secrets.APP_DIR || '/srv/apps/hk-front' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            API_SERVER=${{ secrets.API_SERVER}}
            NEXT_PUBLIC_API_SERVER=${{ secrets.NEXT_PUBLIC_API_SERVER}}
            NEXT_PUBLIC_IMAGE_KIT_ID=${{ secrets.NEXT_PUBLIC_IMAGE_KIT_ID}}
            CMS_SERVER=${{ secrets.CMS_SERVER}}
            NEXT_PUBLIC_CMS_SERVER=${{ secrets.NEXT_PUBLIC_CMS_SERVER}}
            SHOW_CONSTRUCTION=${{ secrets.SHOW_CONSTRUCTION}}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Login to GHCR so docker compose pull can access private images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # Ensure the shared network exists
            docker network create backend || true
            cd "${{ env.APP_DIR }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
