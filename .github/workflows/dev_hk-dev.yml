# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - hk-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://hollandkade.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_b7f3fb7202114d5eb9965889e6e460dc }}
        password: ${{ secrets.AzureAppService_ContainerPassword_4e54d518cea9455a87f8f1e7e367e642 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: hollandkade.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b7f3fb7202114d5eb9965889e6e460dc }}/hk-dev-front:${{ github.sha }}
        file: ./Dockerfile
        build-args: |
          API_SERVER=https://api.holandkade.nl
          NEXT_PUBLIC_API_SERVER=https://api.holandkade.nl
          E2E_TEST=no
          NEXT_PUBLIC_IMAGE_KIT_ID=tdvmspnmgu
          CMS_SERVER=https://cms.hollandkade.nl
          NEXT_PUBLIC_CMS_SERVER=https://cms.hollandkade.nl
          SHOW_CONSTRUCTION=no

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'hk-dev'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_0b24e11661d343319bf7fff2a5b49f5f }}
        images: 'hollandkade.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b7f3fb7202114d5eb9965889e6e460dc }}/hk-dev-front:${{ github.sha }}'